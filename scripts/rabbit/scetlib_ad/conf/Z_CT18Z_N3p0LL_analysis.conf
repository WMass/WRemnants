#-------------------------------------------------------------------------------
# SCETlib autodiff runcard matching the ANALYSIS setup for Z at 13 TeV, CT18Z,
# N3+0LL + NNLO. Use it as --base-conf for
# scripts/rabbit/scetlib_ad/prepare_cache_for_card.py, which replaces the Grid_*
# sections with the card's own gen binning.
#
# Provenance: every [Calculation_settings], [Integration] and [TNPs] entry below
# is copied from the bT-grid production cards for this tune,
#     /scratch/submit/cms/wmass/scetlib_np/Z_COM13_CT18Z_N3p0LL_btgrid_fineall/
#         base.conf
#         inclusive_Z_COM13_CT18Z_N3p0LL_btgrid_fineall_b0nu1.ini
# so that the autodiff prediction is the SAME calculation the analysis's theory
# correction was built from. The examples/matched_ad/matched.conf runcard is NOT
# a substitute: it leaves lambda, the transition points, the scale floors,
# muf_follows_muB, compensate_fo and form_np_prescription at the SCETlib
# defaults, and it has no [TNPs] block -- i.e. plain N3LL with a different
# profile. Measured on the 30-bin debug grid, that mismatch moves the lambda
# RESPONSE by 7% (lambda2, delta_lambda2), 10% (lambda2_nu) and 27-35%
# (lambda4, lambda4_nu) relative to the response itself.
#
# Two deliberate departures from the bT-grid cards, both required:
#   * calculation_piece = matched (they run 'sing' only, and get the nonsingular
#     from DYTurbo; the autodiff cache carries SCETlib's own matched total);
#   * a real [Nonperturbative] block -- the bT-grid production calls
#     force_np_off() and applies the NP factors afterwards in TensorFlow, while
#     here the NP lambdas ARE the differentiated parameters and their values are
#     the rule anchor. Set them to the card's lambda_central.
#
# NOTE the [TNPs] block is what makes this N^{3+0}LL rather than N3LL, and it is
# also what registers the 10 TNP gradient parameters. Matching the analysis order
# and getting differentiable TNPs are the same action; the parameter vector is 19
# long (alphas + 4 eff NP + 4 gamma_nu NP + 10 TNPs), not 9.
#-------------------------------------------------------------------------------

[Process]
boson = Z

[Calculation_settings]
calculation_piece = matched
run_order   = n3ll
fixed_order = nnlo
# Required for the nnlo nonsingular: the native V+jet matrix elements are
# O(alphas) only, and this supplies the O(alphas^2) term. Do NOT set
# pick_structure_function -- it silently swaps the exact O(alphas^2) U+L for the
# NLO/LO graft (see examples/matched_ad/README.md).
fo_order2_analytic = yes

# --- profile / scale block, verbatim from the bT-grid base.conf
recoil_scheme = collins_soper
alphas_solution = analytic
rge_solution = analytic
disable_asymmetry = yes
profile_functional_form = slope
form_np_prescription = collins_soper4
muf_max = 13000.
b0_over_bmax = 0.
b0_over_bmax_global = 0.
lambda = 0.
mu0_min = 1.
muB_min = 1.
muS_min = 1.
nuS_min = 0.
muf_min = 1.40
compensate_fo = yes
transition_points: [0.2, 0.6, 1.0]
muf_follows_muB = no

[Singlet_scheme]
vector_singlet_enabled = yes
axial_singlet_enabled = yes
axial_singlet_use_exact_top_mass = no

[Electroweak]
alphaem = 0.0077624494296896114
sin2_thw = 0.23153999447822571
mZ = 91.153509740726733 # GeV
GammaZ = 2.4932018986110700 # GeV
mW = 79.906853549493746 # GeV
GammaW = 2.0904310808144846 # GeV
ckm = [ [0.97446, 0.222, 0.00365], [0.22438, 0.97359, 0.04214], [0.00896, 0.04133, 0.999105] ]

[QCD]
nf = 5
alphas_mu0 = 0.118
mu0 = 91.1876
alphas_order = n3ll
pdf_set = CT18ZNNLO
pdf_member = 0
Ecm = 13000.

[Integration]
# The bT-grid production ran at 1e-5, but that is a POINT grid; here every bin is
# an adaptive 3-D cubature. The subdivision is driven by the VALUE component, and
# the derivative components are less well resolved than the value at the same
# target (doc/autodiff-design.md: ~4e-6 on the value against ~1e-2 median on the
# gradients at a 1e-3 target), so this is the knob to tighten if the lambda
# response looks noisy -- at roughly a factor 2 in cost per decade.
target_precision_rel = 1.e-4
# MUST be non-zero: pieces whose integrand diverges as qT -> 0 can never satisfy
# a purely relative tolerance.
target_precision_abs = 1.e-9
precision_buffer_bT    = 1.e-2
precision_buffer_decay = 1.e-1
change_var_Q = arctan_Q2
change_var_Q_q0 = 91.15348061918276

[Nonperturbative]
# The rule ANCHOR. Must equal the nonperturbative anchor the card records --
# the model refuses to run otherwise. Values below are the LatticeNP tune.
np_model_nu = tanh_2
lambda2_nu = 0.0870
lambda4_nu = 0.0074
lambda_inf_nu = 1.6853
b0_over_bmax_nu = 1.
np_model = tanh_2
lambda2 = 0.25
delta_lambda2 = 0.0
lambda4 = 0.06
lambda_inf = 1.

[TNPs]
# theta = 0 with 'level0' IS the N^{3+0}LL prescription the analysis uses (the
# "N3p0LL" in the correction names); it is not a no-op. It also registers each
# tag as a differentiable gradient parameter.
gamma_cusp = (0., 'level0')
gamma_mu_q = (0., 'level0')
gamma_nu   = (0., 'level0')
h_qqV      = (0., 'level0')
s          = (0., 'level0')
# The beam TNPs have no native estimate; 'relative' multiplies the highest-order
# coefficient by (1 + theta), which at theta = 0 is the N^{3+0}LL baseline.
b_qqV      = (0., 'relative')
b_qqbarV   = (0., 'relative')
b_qqS      = (0., 'relative')
b_qqDS     = (0., 'relative')
b_qg       = (0., 'relative')
