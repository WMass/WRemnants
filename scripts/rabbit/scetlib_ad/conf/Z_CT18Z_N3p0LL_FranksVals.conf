#-------------------------------------------------------------------------------
# SCETlib autodiff runcard reproducing the CURRENT analysis central prediction:
# Z at 13 TeV, CT18Z, N3+0LL + NNLO, LatticeNP "FranksVals" tune.
#
# Every setting below is copied from the config embedded in the production run
#   /work/submit/lavezzo/alphaS/TheoryCorrections/SCETlib/
#     com13_ct18z_newnps_n3+0ll_lattice_lambda4bugfix_franksvalsvars_fine/
#       inclusive_Z_..._franksvalsvars_fine_combined.pkl
# which is the resummed (calculation_piece = sing) prediction the analysis's
# theory correction is built from. Keeping this runcard compatible with that
# config is what makes the autodiff cache validatable against it bin by bin
# (scripts/rabbit/scetlib_ad/compare_to_scetlib_run.py).
#
# TWO deliberate departures, both required:
#   * calculation_piece = matched -- the reference runs 'sing' only and takes the
#     nonsingular from DYTurbo; the autodiff cache carries SCETlib's own matched
#     total. The resummed sub-piece stays directly comparable to the reference.
#   * fo_order2_analytic = yes -- needed to run the nonsingular at nnlo; it
#     touches only the fixed-order pieces, not the resummed one.
#
# The [TNPs] block is what makes this N^{3+0}LL rather than N3LL, and it is also
# what registers the 10 TNP gradient parameters, so the vector is 19 long
# (alphas + 4 eff NP + 4 gamma_nu NP + 10 TNPs).
#
# Grid_* sections are supplied by prepare_cache_for_card.py, so none is given.
#-------------------------------------------------------------------------------

[Process]
boson = Z

[Calculation_settings]
calculation_piece = matched
run_order   = n3ll
fixed_order = nnlo
# Do NOT set pick_structure_function: it silently swaps the exact O(alphas^2) U+L
# for the NLO/LO graft (see examples/matched_ad/README.md).
fo_order2_analytic = yes

lambda = 0.
b0_over_bmax = 0.
b0_over_bmax_global = 0.
mu0_min = 1.
muB_min = 1.
muS_min = 1.
nuS_min = 0.
muf_min = 1.40
transition_points = [0.2, 0.6, 1.0]
transition_type = slope
scale_setting = spectrum
weight_qT = none
muFO_fixed = 0.
kappaFO = 1.
kappaf = 1.
phase_muH = 1.
muf_follows_muB = no
compensate_fo = yes
form_np_prescription = collins_soper4
scheme_RadISH = no
recoil_scheme = collins_soper
disable_asymmetry = yes
alphas_solution = analytic
alphas_rel_precision = 1.e-6
rge_solution = analytic
profile_functional_form = slope
muf_max = 13000.

[Singlet_scheme]
nonsinglet_use_exact_top_mass = no
vector_singlet_enabled = yes
vector_singlet_use_exact_top_mass = no
axial_singlet_enabled = yes
axial_singlet_use_exact_top_mass = no

[Electroweak]
alphaem = 0.0077624494296896114
sin2_thw = 0.23153999447822571
mZ = 91.153509740726733 # GeV
GammaZ = 2.4932018986110700 # GeV
mW = 79.906853549493746 # GeV
GammaW = 2.0904310808144846 # GeV
ckm = [ [0.97446, 0.222, 0.00365], [0.22438, 0.97359, 0.04214], [0.00896, 0.04133, 0.999105] ]

[QCD]
nf = 5
alphas_mu0 = 0.118
mu0 = 91.1876
alphas_order = n3ll
pdf_set = CT18ZNNLO
pdf_member = 0
Ecm = 13000.

[Integration]
report_error_estimate = yes
target_precision_rel = 1.e-4
target_precision_abs = 1.e-8
precision_buffer_bT = 1.e-1
precision_buffer_decay = 1.e-1
tolerance_qT = 1.
precision_buffer_full = 1.
abs_precision_buffer_inner = 1.
change_var_Q = arctan_Q2
change_var_Q_q0 = 91.15348061918276
change_var_qT = none
change_var_qT_q0 = 1.

[Nonperturbative]
# The rule ANCHOR = the FranksVals tune, i.e. the reference run's central.
np_model_nu = tanh_2
lambda2_nu = 0.15
lambda4_nu = 0.
lambda6_nu = 0.
lambda_inf_nu = 2.
b0_over_bmax_nu = 1.
np_model = tanh_2
lambda2 = 0.4
lambda4 = 0.4
lambda6 = 0.
lambda_inf = 1.
delta_lambda2 = 0.0
np_model_tmd = off
lambda4_i = 0.

[TNPs]
# theta = 0 with 'level0' IS the N^{3+0}LL prescription; not a no-op.
gamma_cusp = (0., 'level0')
gamma_mu_q = (0., 'level0')
gamma_nu   = (0., 'level0')
h_qqV      = (0., 'level0')
s          = (0., 'level0')
b_qqV      = (0., 'relative')
b_qqbarV   = (0., 'relative')
b_qqS      = (0., 'relative')
b_qqDS     = (0., 'relative')
b_qg       = (0., 'relative')
